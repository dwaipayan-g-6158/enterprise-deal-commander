    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Paired so the OS chrome matches the app instead of forcing a dark strip
         over a light page. ThemeColorSync rewrites the active one when the
         in-app theme toggle runs; these two cover first paint. Values are the
         --background token from index.css for each mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171a" />
    <!-- Installed-app behaviour.

         status-bar-style is `default`, not `black-translucent`, and that is a
         legibility fix rather than a preference. black-translucent draws the page
         under the status bar AND forces light glyphs regardless of theme, so in
         light mode the clock, battery and carrier render white-on-near-white over
         the shell's light glass header. There is no scrim that rescues it: measured
         over the light header, white glyphs reach 1.82:1 at 0.28 alpha, 2.79 at
         0.45 and only 3.70 at 0.55 — by which point it is a black bar, not glass,
         and still short of 4.5:1.

         `default` hands the status bar back to iOS, which picks glyph colour from
         the system appearance. The cost is losing edge-to-edge under the status
         bar; the benefit is a readable clock. env(safe-area-inset-top) collapses
         to 0 on iOS as a result, so pt-safe becomes a no-op there — it is kept
         because Android draws edge-to-edge and iOS landscape still reports insets.
         Without viewport-fit=cover above, every inset resolves to zero. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deal Commander" />
    <title>Enterprise Deal Commander</title>
    <meta name="description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />

    <meta property="og:title" content="Enterprise Deal Commander" />
    <meta property="og:description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />
    <meta property="og:type" content="website" />
    <!-- `summary_large_image` was declared for months with no image behind it,
         which unfurls as a title and a blank slab. The card is a rendered brand
         image rather than a screenshot of the app: every real screen is behind
         invite-only auth, so a preview of one would show data to people who
         cannot open it. Root-absolute for the same reason as apple-touch-icon —
         a relative href resolves against whatever path was shared. -->
    <meta property="og:image" content="/opengraph.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Enterprise Deal Commander — technical reality, tracked as rigorously as revenue." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enterprise Deal Commander" />
    <meta name="twitter:description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />
    <meta name="twitter:image" content="/opengraph.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Root-absolute: a relative href resolves against the current path, so
         installing from /deals/123 asked iOS for /deals/apple-touch-icon.png
         and it fell back to a screenshot of the page. Vite rewrites this for
         BASE_PATH at build time. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

         and the wordmark is still at opacity 0. A logo here would cut to a logo
         that then draws itself in from nothing.

         Dark carries a prefers-color-scheme clause and comes first; light
         carries none and acts as the catch-all, so an engine that does not
         understand the feature still gets an image instead of a blank screen. -->
