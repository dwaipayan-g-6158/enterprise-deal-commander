<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Paired so the OS chrome matches the app instead of forcing a dark strip
         over a light page. ThemeColorSync rewrites the active one when the
         in-app theme toggle runs; these two cover first paint. Values are the
         --background token from index.css for each mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171a" />
    <!-- Installed-app behaviour. black-translucent draws the page under the
         status bar, which is why the mobile shell's chrome pads itself with
         env(safe-area-inset-*); without viewport-fit=cover above, those insets
         resolve to zero. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deal Commander" />
    <title>Enterprise Deal Commander</title>
    <meta name="description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Enterprise Deal Commander" />
    <meta property="og:description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enterprise Deal Commander" />
    <meta name="twitter:description" content="Enterprise Deal Commander — a cockpit for managing enterprise software deals, risk, and governance." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Root-absolute: a relative href resolves against the current path, so
         installing from /deals/123 asked iOS for /deals/apple-touch-icon.png
         and it fell back to a screenshot of the page. Vite rewrites this for
         BASE_PATH at build time. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Geist + Geist Mono only. Inter was loaded but assigned to nothing —
         a third family of render-blocking weights for no glyphs on screen.
         Requested as a variable axis rather than fixed instances: the mobile
         type scale sets weights between the stops (450 body, 550 eyebrow,
         650 headline) to separate levels without leaning on size alone, and
         static instances would snap each of those to a neighbour. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
